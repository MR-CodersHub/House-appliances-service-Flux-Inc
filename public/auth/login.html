<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MOTORWORKS</title>
<link rel="icon" href="../../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>



<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="../../index.html" class="logo"><span class="dot"></span>MOTORWORKS</a>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>
    <form class="auth-form" data-type="login">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Enter your password" required>
        <span class="form-error"></span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
        <div class="checkbox-group"><input type="checkbox" id="remember"><label for="remember">Remember me</label></div>
        <a href="#" style="color:var(--amber);font-size:13px;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;text-align:center;">Sign In</button>
    </form>
    
    <div class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</section>

<script src="../../src/js/theme.js"></script>
<script src="../../src/js/data.js"></script>
<script src="../../src/js/form-validation.js"></script>
<script src="../../src/js/main.js"></script>
</body>
</html>
