  </g>
  <!-- Typography -->
  <g class="logo-text">
    <text x="64" y="38" font-family="'Big Shoulders Display', 'Inter', sans-serif" font-size="32" font-weight="800" letter-spacing="1.5" fill="currentColor">MOTORWORKS</text>
    <text x="65" y="54" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="3" fill="#d9622b">PRECISION AUTO CARE</text>
  </g>
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="44" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f27036"/>
      <stop offset="1" stop-color="#b34718"/>
    </linearGradient>
  </defs>
</svg>
