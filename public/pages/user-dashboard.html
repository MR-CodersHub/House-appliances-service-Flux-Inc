<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard — Flux Inc</title>
  <link rel="icon" href="../../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="logo">
        <a href="../../index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
          <img src="../../assets/img/logo.png" alt="Flux Inc" style="height:32px;width:auto;">
          <span class="logo-brand-title">FLUX INC</span>
        </a>
      </div>
      <div class="sidebar-section-label">Main Menu</div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="active" data-section="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard Overview
        </a>
        <a href="#new-request" data-section="new-request">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Request Repair
        </a>
        <a href="#tracking" data-section="tracking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Live Tech Tracking
        </a>
        <a href="#appliances" data-section="vehicles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><line x1="8" y1="6" x2="16" y2="6"/></svg>
          My Appliances
        </a>
        <a href="#history" data-section="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Repair History
        </a>
        <a href="#invoices" data-section="invoices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Invoices &amp; Billing
        </a>
      </nav>

      <div class="sidebar-section-label">Account</div>
      <nav class="sidebar-nav">
        <a href="#profile" data-section="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile &amp; Address
        </a>
        <a href="../../index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Website
        </a>
      </nav>
    </aside>

    <!-- Main Dashboard Container -->
    <main class="dashboard-main" id="userDashboardMain"></main>
  </div>

  <!-- Scripts -->
  <script src="../../src/js/theme.js"></script>
  <script src="../../src/js/data.js"></script>
  <script src="../../src/js/navbar.js"></script>
  <script src="../../src/js/dashboard.js"></script>
</body>
</html>
