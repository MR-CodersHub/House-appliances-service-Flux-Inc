<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account — Flux Inc</title>
  <link rel="icon" href="../../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>

<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="../../index.html" class="logo" style="justify-content:center;margin-bottom:12px;">
        <img src="../../assets/img/logo.png" alt="Flux Inc Logo" class="logo-img" style="height:32px;width:auto;">
        <span class="logo-text-group"><span class="logo-brand-title" style="color: var(--bone);">Flux Inc</span></span>
      </a>
      <h2>Create Customer Account</h2>
    </div>
    <form class="auth-form" data-type="signup">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" placeholder="Sarah Miller" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="sarah@example.com" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-input" placeholder="+1 (800) 555-0199" required>
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" class="form-input" id="signupPass" placeholder="Min 8 characters" required data-minlength="8">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
            <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="form-error"></span>
      </div>
      <div class="checkbox-group" style="margin-bottom:24px;">
        <input type="checkbox" id="terms" required checked>
        <label for="terms" style="font-size:13px;color:var(--steel);">I agree to the <a href="../pages/terms-of-service.html" style="color:var(--amber);">Terms of Service</a> and <a href="../pages/privacy-policy.html" style="color:var(--amber);">Privacy Policy</a></label>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;text-align:center;">Create Customer Account</button>
    </form>
    <div class="auth-divider">OR</div>
    <button type="button" class="auth-social-btn">
      <svg class="auth-social-icon" width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <button type="button" class="auth-social-btn">
      <svg class="auth-social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.4c.66-.82 1.11-1.96.99-3.1-.96.04-2.11.64-2.79 1.44-.59.69-1.11 1.83-.97 2.93 1.07.08 2.14-.54 2.77-1.27z"/>
      </svg>
      <span>Continue with Apple</span>
    </button>
    <div class="auth-switch">Already have an account? <a href="login.html">Sign In</a></div>
  </div>
</section>

<script src="../../src/js/theme.js"></script>
<script src="../../src/js/data.js"></script>
<script src="../../src/js/form-validation.js"></script>
<script src="../../src/js/main.js"></script>
</body>
</html>
