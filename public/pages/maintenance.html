<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Flux Inc</title>
<link rel="icon" href="../../assets/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/styles.css">
</head>
<body>



    <!-- Main Content -->
    <main>
        <section class="coming-soon">
            <div class="coming-soon-bg"><img src="../../assets/img/car-banner.jpg" alt="Workshop background"></div>
            <div class="container">
                <div class="coming-soon-content">
                    <span class="eyebrow">COMING SOON</span>
                    <h1>Something Great Is Coming</h1>
                 <div id="countdown" class="countdown">
                        <div class="countdown-item">
                            <span class="countdown-num" id="countdown-days">00</span>
                            <span class="countdown-label">Days</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-num" id="countdown-hours">00</span>
                            <span class="countdown-label">Hours</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-num" id="countdown-mins">00</span>
                            <span class="countdown-label">Mins</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-num" id="countdown-secs">00</span>
                            <span class="countdown-label">Secs</span>
                        </div>
                    </div>
                  
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../../src/js/theme.js"></script>
    <script src="../../src/js/data.js"></script>
    <script src="../../src/js/main.js"></script>
</body>
</html>
