    <path d="M22 6 L44 14 V32 C44 47 33 58 22 64 C11 58 0 47 0 32 V14 L22 6 Z" fill="url(#brandGrad)" />
    <!-- Inner Crosshair & Piston V -->
    <path d="M22 14 L34 26 L22 52 L10 26 Z" fill="#0b0c0e" opacity="0.25"/>
    <path d="M22 18 L30 26 L22 46 L14 26 Z" fill="#ffffff"/>
    <circle cx="22" cy="28" r="4" fill="#d9622b"/>
